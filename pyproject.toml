[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-achievement-rate"
version = "0.3.0"
description = "Deterministic A/G/I letter coverage for API request names"
readme = "README.en.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/mars102574-max/agi-achievement-rate"
Issues = "https://github.com/mars102574-max/agi-achievement-rate/issues"

[project.scripts]
agi-rate = "agi_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["agi_benchmark*"]
